<!doctype html>
<html lang="$default_language" data-default-language="$default_language" data-document-slug="$slug">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$page_title</title>
<style>
:root{color-scheme:light;--paper:#fffdf9;--cream:#fff8f4;--ink:#292524;--muted:#78716c;--line:#e7d9cf;--orange:#ea580c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.75 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,a{touch-action:manipulation}a{color:#a63c06;text-underline-offset:.2em;overflow-wrap:anywhere}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:.5rem .85rem;border-radius:8px}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:4px}button[aria-pressed="true"]{background:var(--orange);color:white;border-color:var(--orange)}[hidden]{display:none!important}.js-only{display:none}.has-js .js-only{display:flex}.toolbar{max-width:1120px;margin:auto;padding:1.2rem 1.5rem;display:flex;gap:1rem;justify-content:space-between;align-items:center;flex-wrap:wrap}.controls{gap:.5rem;flex-wrap:wrap}.language-group{display:flex;gap:.35rem}.layout{max-width:1120px;margin:0 auto;padding:1.5rem;display:grid;grid-template-columns:minmax(0,850px) minmax(160px,1fr);gap:2.5rem}.document{min-width:0;background:var(--paper);padding:clamp(1.5rem,4vw,3.5rem);border:1px solid var(--line);border-radius:14px}.rail{font-size:.85rem;padding-top:1rem;overflow-wrap:anywhere}.rail h2{font-size:1rem}.rail ul{list-style:none;padding:0}.rail li{margin:.75rem 0}h1,h2,h3{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;line-height:1.3;font-weight:600}h1{font-size:clamp(2rem,4vw,3.2rem);margin:1rem 0}h2{font-size:1.65rem;margin:0 0 1rem}h3{font-size:1.1rem;margin:0 0 .6rem}.subtitle,.lead{color:#57534e}.subtitle{font-size:1.15rem}.badge{display:inline-block;color:#9a3412;background:#ffedd5;border:1px solid #fed7aa;border-radius:99px;padding:.2rem .8rem;font-size:.8rem}.metadata{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;border-block:1px solid var(--line);padding:1.3rem 0;margin:2rem 0}.metadata div{min-width:0}.metadata dt{font-size:.8rem;color:var(--muted)}.metadata dd{margin:0;font-weight:500}section{border-top:1px solid var(--line);padding-top:2rem;margin-top:2rem;scroll-margin-top:1rem}p{white-space:pre-line;overflow-wrap:anywhere}.callout{border:1px solid #fed7aa;border-left:4px solid var(--orange);background:var(--cream);border-radius:8px;padding:1.1rem 1.3rem;margin:1.5rem 0}.callout p{margin:.25rem 0}.callout.warning{background:#fff4db;border-color:#e7ba73}li{margin:.5rem 0}.table-wrap{overflow-x:auto;margin:1.5rem 0}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:.8rem;min-width:120px;overflow-wrap:anywhere}th{background:var(--cream)}.footer{max-width:1120px;margin:auto;padding:1.5rem;color:var(--muted);font-size:.8rem}.fallback{padding:1rem;background:#ffedd5} @media(max-width:800px){.layout{display:flex;flex-direction:column;gap:1rem;padding:1rem}.rail{order:-1;padding:0}.rail ul{display:flex;gap:1rem;flex-wrap:wrap}.rail li{margin:0}.document{padding:1.5rem}.toolbar{padding:1rem}body{font-size:16px}}@media print{body{background:white;color:black;font-size:11pt}.toolbar,.rail,.footer{display:none!important}.layout{display:block;padding:0;max-width:none}.document{border:0;padding:0}section{break-inside:auto}.callout,table{break-inside:avoid}a{color:inherit}.badge{border:1px solid #aaa}h1{font-size:25pt}}
.layout{grid-template-columns:minmax(0,1fr) 220px}.rail{position:fixed;top:96px;right:max(24px,calc((100vw - 1120px)/2 + 24px));width:220px;max-height:calc(100dvh - 120px);overflow-y:auto;padding:1.1rem;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px #2925240a}.rail-actions{display:flex;flex-direction:column;gap:.5rem;border-top:1px solid var(--line);padding-top:1rem}.rail-actions button,.rail-actions>a{font-size:.85rem;text-align:left}.document-section>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:.8rem;border-radius:6px}.document-section>summary::-webkit-details-marker{display:none}.document-section>summary::before{content:'+';color:var(--orange);font:600 1.4rem/1 system-ui;flex:0 0 1rem}.document-section[open]>summary::before{content:'−'}.document-section>summary h2{margin:0}.document-section>summary:focus-visible{outline:3px solid var(--orange);outline-offset:5px}.section-body{padding-top:1rem}section[id]{scroll-margin-top:24px}
@media(max-width:800px){.layout{grid-template-columns:minmax(0,1fr)}.rail{position:static;width:auto;max-height:none;grid-row:1;padding:1rem}.rail ul{display:flex;flex-wrap:wrap;gap:.4rem 1rem}.rail li{margin:.15rem 0}.rail-actions{flex-direction:row;flex-wrap:wrap;align-items:center}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{.layout{display:block}.rail{display:none}.document-section>summary::before{display:none}.section-body{display:block!important}}
.layout{max-width:1600px;padding:24px;grid-template-columns:minmax(0,1fr) 240px;gap:24px}.document{padding:clamp(24px,3vw,44px)}.rail{top:24px;right:max(24px,calc((100vw - 1600px)/2 + 24px));width:240px;max-height:calc(100dvh - 48px)}.rail .toolbar{padding:0;display:block;margin:0 0 1.2rem}.rail .language-group{margin-bottom:.75rem}.rail .controls{flex-direction:column;gap:.5rem}.rail .controls button{text-align:left;font-size:.85rem}.footer{max-width:1600px;padding:24px}
@media(max-width:800px){.layout{display:flex;flex-direction:column;padding:16px;gap:16px}.rail{position:static;width:auto;max-height:none;order:-1}.rail .toolbar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}.rail .language-group{margin-bottom:0}.rail .controls{flex-direction:row;flex-wrap:wrap}.document{padding:24px}}
@media print{.layout{display:block;max-width:none;padding:0}.document{padding:0}.rail{display:none!important}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.icon-control{position:relative;width:44px;height:44px;padding:10px!important;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}.icon-control svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.icon-control:hover{background:#ffedd5;border-color:#ea580c}.tip-control::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 6px);left:0;padding:5px 8px;border-radius:6px;background:var(--ink);color:white;font:12px/1.4 system-ui;white-space:nowrap;pointer-events:none;opacity:0;z-index:5}.tip-control:hover::after,.tip-control:focus-visible::after{opacity:1}.rail .controls,.rail-actions{flex-direction:row;gap:8px;flex-wrap:wrap}.rail-actions>a{border:1px solid var(--line);border-radius:8px}.rail li{margin:8px 0}.rail li a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--cream);text-decoration:none;line-height:1.45}.rail li a:hover,.rail li a:focus-visible{background:#ffedd5;border-color:var(--orange)}.language-toggle{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:8px 12px}.toggle-track{position:relative;width:36px;height:20px;border-radius:20px;background:#d6c3b6;flex:none}.toggle-track::before{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;background:white;border-radius:50%}.language-toggle[aria-checked=true] .toggle-track{background:var(--orange)}.language-toggle[aria-checked=true] .toggle-track::before{left:19px}.language-toggle[aria-checked=false] .lang-en,.language-toggle[aria-checked=true] .lang-zh{color:var(--muted)}.rail .language-group{width:100%}.rail ul{display:block}
.language-toggle::after{top:calc(100% + 6px);bottom:auto}
/* Keep JS-only actions hidden despite later component display rules. */
html:not(.has-js) .js-only{display:none!important}
</style>
</head>
<body id="document-top">
<noscript><div class="fallback" lang="zh">未启用 JavaScript，以下显示中英双语。请使用浏览器保存或打印。</div><div class="fallback" lang="en">JavaScript is disabled. Both languages are shown below. Use your browser to save or print.</div></noscript>
<div class="layout"><main class="document">
<header><div class="badge">$visibility</div><h1 id="document-title">$title</h1><p class="subtitle">$subtitle</p>$metadata$notice</header>
$content
</main><nav class="rail" aria-label="目录与操作 / Contents and controls">
<div class="toolbar">
<div class="js-only language-group" role="group" aria-label="语言 / Language">
<button type="button" id="language-toggle" class="language-toggle tip-control" role="switch" aria-checked="false" aria-label="切换为英语 / Switch to English"><span class="lang-zh" lang="zh">中文</span><span class="toggle-track" aria-hidden="true"></span><span class="lang-en" lang="en">English</span></button>
</div>
<div class="js-only controls"><button type="button" id="download-html" class="icon-control tip-control" data-tip-zh="下载 HTML" data-tip-en="Download HTML"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><span class="sr-only">$download_label</span></button><button type="button" id="print-document" class="icon-control tip-control" data-tip-zh="打印" data-tip-en="Print"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V8h16v9h-3M7 14h10v7H7zM17 11h1"/></svg><span class="sr-only">$print_label</span></button></div>
</div>
<h2>$contents_label</h2><ul>$contents</ul><div class="rail-actions"><button class="js-only icon-control tip-control" type="button" id="expand-all" data-tip-zh="展开全部" data-tip-en="Expand all"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 5-4 5 4M12 3v7m-5 7 5 4 5-4M12 14v7"/></svg><span class="sr-only"><span lang="zh" data-language="zh">展开全部</span><span lang="en" data-language="en">Expand all</span></span></button><button class="js-only icon-control tip-control" type="button" id="collapse-all" data-tip-zh="折叠全部" data-tip-en="Collapse all"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 6 5 4 5-4M12 3v7m-5 8 5-4 5 4M12 14v7"/></svg><span class="sr-only"><span lang="zh" data-language="zh">折叠全部</span><span lang="en" data-language="en">Collapse all</span></span></button><a href="#document-top" class="icon-control tip-control" data-tip-zh="返回顶部" data-tip-en="Back to top" aria-label="返回顶部 / Back to top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14M12 20V8m-6 6 6-6 6 6"/></svg><span class="sr-only"><span lang="zh" data-language="zh">返回顶部</span><span lang="en" data-language="en">Back to top</span></span></a></div></nav></div>
<footer class="footer">$footer</footer>
<script>
(function () {
  'use strict';
  const root = document.documentElement;
  const storageKey = 'bilingual-document:' + root.dataset.documentSlug + ':language';
  function setLanguage(language, remember) {
    const lang = language === 'en' ? 'en' : 'zh';
    document.querySelectorAll('[data-language]').forEach(function (node) {
      node.hidden = node.dataset.language !== lang;
    });
    root.lang = lang;
    document.title = document.querySelector('#document-title [data-language="' + lang + '"]').textContent;
    const toggle = document.getElementById('language-toggle');
    toggle.setAttribute('aria-checked', String(lang === 'en'));
    const switchLabel = lang === 'zh' ? '切换为英语' : 'Switch to Chinese';
    toggle.setAttribute('aria-label', switchLabel);
    toggle.dataset.tooltip = switchLabel;
    toggle.title = switchLabel;
    document.querySelectorAll('[data-tip-zh]').forEach(function (button) {
      const label = lang === 'zh' ? button.dataset.tipZh : button.dataset.tipEn;
      button.dataset.tooltip = label;
      button.title = label;
      button.setAttribute('aria-label', label);
    });
    if (remember) { try { localStorage.setItem(storageKey, lang); } catch (error) {} }
  }
  let preferred = root.dataset.defaultLanguage;
  try { const saved = localStorage.getItem(storageKey); if (saved === 'zh' || saved === 'en') preferred = saved; } catch (error) {}
  setLanguage(preferred, false);
  root.classList.add('has-js');
  document.getElementById('language-toggle').addEventListener('click', function () { setLanguage(root.lang === 'zh' ? 'en' : 'zh', true); });
  const sections = Array.from(document.querySelectorAll('details.document-section'));
  function setAllSections(open) { sections.forEach(function (section) { section.open = open; }); }
  document.getElementById('expand-all').addEventListener('click', function () { setAllSections(true); });
  document.getElementById('collapse-all').addEventListener('click', function () { setAllSections(false); });
  function openHashSection() {
    const target = document.getElementById(window.location.hash.slice(1));
    const section = target && target.querySelector('details.document-section');
    if (section) { section.open = true; target.scrollIntoView(); }
  }
  document.querySelectorAll('.rail a[href^="#section-"]').forEach(function (link) {
    link.addEventListener('click', function () {
      const target = document.getElementById(link.getAttribute('href').slice(1));
      if (target) target.querySelector('details.document-section').open = true;
    });
  });
  window.addEventListener('hashchange', openHashSection);
  if (window.location.hash) openHashSection();
  let beforePrintState = null;
  function preparePrint() {
    if (beforePrintState === null) beforePrintState = sections.map(function (section) { return section.open; });
    setAllSections(true);
  }
  window.addEventListener('beforeprint', preparePrint);
  window.addEventListener('afterprint', function () {
    if (beforePrintState !== null) sections.forEach(function (section, index) { section.open = beforePrintState[index]; });
    beforePrintState = null;
  });
  document.getElementById('print-document').addEventListener('click', function () { preparePrint(); window.print(); });
  document.getElementById('download-html').addEventListener('click', function () {
    const clone = document.cloneNode(true);
    const html = clone.documentElement;
    html.classList.remove('has-js');
    if (!html.className) html.removeAttribute('class');
    html.lang = html.dataset.defaultLanguage;
    clone.querySelectorAll('[data-language]').forEach(function (node) { node.removeAttribute('hidden'); });
    clone.querySelectorAll('details.document-section').forEach(function (node) { node.open = true; });
    clone.getElementById('language-toggle').setAttribute('aria-checked', String(html.dataset.defaultLanguage === 'en'));
    clone.title = clone.querySelector('#document-title [data-language="' + html.dataset.defaultLanguage + '"]').textContent;
    const blob = new Blob(['<!doctype html>\n' + html.outerHTML], {type: 'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = root.dataset.documentSlug + '.html';
    document.body.appendChild(link); link.click(); link.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  });
}());
</script>
</body>
</html>
